<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#111827">
    <title>Hellow World</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #111827;
        color: #f9fafb;
      }

      * { box-sizing: border-box; }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        background: radial-gradient(ellipse at top, #243b64, #111827 65%);
      }

      main {
        padding: 3rem 2rem;
        text-align: center;
      }

      h1 {
        margin: 0;
        font-size: clamp(3rem, 10vw, 7rem);
        letter-spacing: -0.06em;
      }

      p {
        margin: 1rem 0 0;
        color: #cbd5e1;
        font-size: clamp(1rem, 2vw, 1.25rem);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Hellow World</h1>
      <p>My first page on GitHub Pages. 임재성이 만듬</p>
    </main>
  </body>
</html>
